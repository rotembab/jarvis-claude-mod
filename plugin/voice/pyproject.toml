[project]
name = "jarvis-voice"
version = "0.7.0"
description = "Local voice helper for the Jarvis Claude Code mod: wake word, push-to-talk, faster-whisper STT, Fish Audio live TTS."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.5.1",
    "soxr>=0.5",
    "faster-whisper>=1.1.1",
    # The wake word and voice activity models run on it (faster-whisper needs it too).
    "onnxruntime>=1.17,<2",
    # Pinned exactly: the Windows wheel bundles cuDNN's cudnn64_9.dll dispatcher
    # (9.10.2.21 in 4.8.2), and the cuDNN sub-libraries in the `cuda` extra must
    # be the same version. Bump both together.
    "ctranslate2==4.8.2",
    "websockets>=15",
    "ormsgpack>=1.9",
    "pynput>=1.8.1",
    # Home control (jarvis_voice.home). Imported only when a home command runs,
    # so the voice helper starts no slower; about 10 MB of wheels on Windows.
    # Apple TV over the Companion protocol.
    "pyatv>=0.18,<0.19",
    # Tuya / Smart Life devices on the home network.
    "tinytuya>=1.20,<2",
    # The one-time Smart Life QR link that fetches the Tuya local keys.
    "tuya-device-sharing-sdk>=0.2.15,<0.3",
    # tuya-device-sharing-sdk imports cryptography without declaring it, and
    # relies on paho-mqtt 2's default callback API, which 3.x may drop.
    "cryptography>=44",
    "paho-mqtt>=2,<3",
    # Draws the Smart Life QR code (pure Python, no Pillow).
    "segno>=1.6",
    # WebRTC's echo canceller (AEC3) and high-pass filter, so Jarvis doesn't hear himself through speakers.
    "livekit>=1.1.20,<2",
]

[project.optional-dependencies]
# GPU libraries for CTranslate2. Windows also needs cuDNN's sub-libraries
# (cudnn_ops64_9.dll, cudnn_cnn64_9.dll, ...): the Whisper encoder's first
# Conv1D aborts the process without them. The Linux wheel does not use cuDNN.
cuda = [
    "nvidia-cublas-cu12>=12.4 ; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12==9.10.2.21 ; sys_platform == 'win32'",
]

[project.scripts]
jarvis-voice = "jarvis_voice.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "jsonschema>=4.23"]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]
# These ship compiled wheels for every platform Jarvis supports. Refusing to
# build them from source makes a future lock that loses a wheel fail with a
# clear message instead of a compiler error on the user's machine.
no-build-package = ["cryptography", "pydantic-core", "miniaudio", "zeroconf", "aiohttp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "I", "UP", "SIM", "RUF", "N"]
ignore = ["SIM105", "RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["jarvis_voice"]
known-local-folder = ["conftest", "fakes", "fish_fake", "home_fakes"]
