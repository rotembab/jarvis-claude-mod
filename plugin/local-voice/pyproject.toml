[project]
name = "jarvis-local-voice"
version = "0.1.0"
description = "Local text-to-speech for the Jarvis Claude Code mod: Chatterbox-Turbo in its own process, spoken to over stdin/stdout."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Pins torch 2.6.0, transformers, numpy<2 and the rest of its stack exactly.
    # /jarvis setup local installs it with `uv pip install --torch-backend cu126`
    # on an NVIDIA GPU, so torch comes from PyTorch's CUDA index.
    "chatterbox-tts==0.1.7",
    # resemble-perth (Chatterbox's watermarker) imports pkg_resources, which
    # setuptools 82 removed; without it the model fails to load.
    "setuptools<82",
]

[project.scripts]
jarvis-local-voice = "jarvis_local_voice.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "I", "UP", "SIM", "RUF", "N"]
ignore = ["SIM105", "RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["jarvis_local_voice"]
