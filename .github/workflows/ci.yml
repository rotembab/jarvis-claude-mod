name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper:
    name: helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # sounddevice bundles PortAudio in its Windows and macOS wheels; on Linux it
      # loads the system library, so install it for the import to succeed.
      - name: Install PortAudio
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2

      # setup-uv publishes no floating major tag, so pin the release by commit.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: plugin/voice/uv.lock

      # --locked fails the build when uv.lock is out of date with pyproject.toml;
      # /jarvis setup installs from the lock file, so it must stay current.
      - name: Install the helper and its dev dependencies
        run: uv sync --locked --project plugin/voice --group dev

      # JARVIS_WAKE_MODELS_DIR lets the two tests that need the real "Hey Jarvis"
      # model download it (about 3.7 MB from openWakeWord's GitHub release).
      - name: Run helper tests
        env:
          JARVIS_WAKE_MODELS_DIR: ${{ runner.temp }}/wake-models
        run: uv run --locked --project plugin/voice pytest -q plugin/voice/tests

  hands:
    name: hands (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # MediaPipe's Linux wheel links EGL and GLES even when it runs on the CPU.
      - name: Install EGL
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: plugin/hands/uv.lock

      - name: Lint
        run: |
          uvx ruff check --config plugin/hands/pyproject.toml plugin/hands
          uvx ruff format --check --config plugin/hands/pyproject.toml plugin/hands

      # --locked: /jarvis setup hands installs from the lock file, so it must stay current.
      - name: Install the hand helper and its dev dependencies
        run: uv sync --locked --project plugin/hands --group dev

      # JARVIS_HANDS_MODELS_DIR lets the real-model tests download the hand model
      # (about 8 MB, checked by SHA-256) and MediaPipe's test photos.
      - name: Run hand helper tests
        env:
          JARVIS_HANDS_MODELS_DIR: ${{ runner.temp }}/hands-models
        run: uv run --locked --project plugin/hands pytest -q plugin/hands/tests

  local-voice:
    name: local voice protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      # The server and its tests use only the standard library (a fake voice
      # stands in for the model), so torch and Chatterbox are not installed here.
      - name: Lint
        run: uvx ruff check --config plugin/local-voice/pyproject.toml plugin/local-voice

      - name: Run local voice tests
        env:
          PYTHONPATH: plugin/local-voice/src
        run: uv run --no-project --with pytest pytest -q plugin/local-voice/tests

  mod:
    name: mod
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Claude Code
        run: |
          npm i -g @anthropic-ai/claude-code
          claude --version

      # Checks the marketplace file and the plugin.json of the entry it lists.
      - name: Validate the marketplace
        run: claude plugin validate --strict .

      # Checks the manifest, the userConfig, the types contract and the hooks module.
      - name: Validate the plugin
        run: claude plugin validate plugin

      # Runs plugin/hooks/*.test.ts against the engine. The tests mock the helper
      # ($.process.spawn, $.http.fetch) and need no login or API key.
      - name: Run mod tests
        run: claude plugin test plugin

      # No `tsc -p plugin` step: Claude Code writes the API declarations into
      # plugin/.claude-plugin/types/ only when a session loads the mod, and no
      # command lays them without one. docs/DEVELOPING.md has the local check.
